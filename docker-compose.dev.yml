services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: ajile-main-backend-dev

    ports:
      - "${BACKEND_PORT:-5000}:5000"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}

      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PRESENTER_PASSWORD: ${PRESENTER_PASSWORD:-Presenter@12345}

      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SERVER: ${DB_SERVER:-100.64.1.43}
      DB_DATABASE: ${DB_DATABASE:-jira}
      DB_PORT: ${DB_PORT:-5432}
      DB_SSL: ${DB_SSL:-false}

    command: npm run dev

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:5000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - zira-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development

    container_name: ajile-main-frontend-dev

    working_dir: /app

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      VITE_API_URL: /api
      VITE_SOCKET_URL: ""
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - zira-network

volumes:
  backend_node_modules:
  frontend_node_modules:

networks:
  zira-network:
    name: zira-network
    driver: bridge